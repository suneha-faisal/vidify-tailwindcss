<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Figma</title>
</head>

<body>
    <div class="h-[50px] w-full bg-black flex justify-between  px-4">
        <div class="pt-3">
            <img class="" src="images/logo.png" alt="Logo">
        </div>
        <div class="flex items-center space-x-4 w-full max-w-2xl justify-end">
            <div class="relative w-full max-w-sm">
                <img class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 pointer-events-none brightness-0 invert opacity-60"

                <input type="text"
                    class="w-full h-[30px] ps-10 pe-4 bg-gray-800 text-white/90 placeholder-white/50 rounded-lg border border-gray-700 focus:outline-none focus:border-gray-500"
                    placeholder="Search">
            </div>
            
            <div class="h-[30px] w-[30px] bg-gray-800 rounded-lg flex justify-center items-center">
                <img class="h-4" src="images/face.png" alt="Face">
            </div>
            <div class="h-[30px] w-[30px] bg-gray-800 rounded-lg flex justify-center items-center">
                <img class="h-4" src="images/bell.png" alt="Bell">
            </div>
            <div class="bg-gray-800 h-[30px] px-3 rounded-lg flex items-center space-x-2 shrink-0">
                <p class="text-white text-sm">Steller Interiors</p>
                <img class="h-4 w-4 rounded-lg" src="images/logo2.png" alt="Logo 2">
            </div>
        </div>
    </div>
    </div>
    
    <div class="bg-slate-100 w-[18%] h-[900px]">
        <div class="flex items-center gap-3 pt-3 pl-5">
            <img src="images/home.png">
            <p>Home </p>
        </div>
        <div class="flex items-center gap-3 pt-3 pl-5">
            <img src="images/order.png">
            <p>Orders </p>
        </div>
        <div class="flex items-center gap-3 pt-3 pl-5">
            <img src="images/product.png">
            <p>Products </p>
        </div>
        <div class="flex items-center gap-3 pt-3 pl-5">
            <img src="images/customer.png">
            <p>Customers </p>
        </div>
        <div class="flex items-center gap-3 pt-3 pl-5">
            <img src="images/content.png">
            <p>Content</p>
        </div>
        <div class="flex items-center gap-3 pt-3 pl-5">
            <img src="images/fiances.png">
            <p>Fiances</p>
        </div>
        <div class="flex items-center gap-3 pt-3 pl-5">
            <img src="images/analytist.png">
            <p>Analytics</p>
        </div>
        <div class="flex items-center gap-3 pt-3 pl-5">

        </div>
        <div class="flex items-center gap-3 pt-3 pl-5">

        </div>

            <img src="images/store.png">
            <p>Online Store</p>
        </div>
        <div class="flex items-center gap-3 pt-3 pl-5">
            <img src="images/sale.png">
            <p>Point of Sale</p>
        </div>
        <div class="flex items-center gap-3 pt-3 pl-5">
            <img src="images/shop.png">
            <p>Shop</p>
        </div>

        <div class="bg-white w-[90%] h-[40px] rounded-lg ml-3 mt-3 flex items-center ">

         <p class="ml-3">Vidify</p>
